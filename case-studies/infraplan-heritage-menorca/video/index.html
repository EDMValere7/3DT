<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>3DT × Infraplan — Heritage Reconstruction — Reel 45s</title>
<style>
  @font-face { font-family: "Inter Tight"; src: url(fonts/InterTight.woff2) format("woff2"); font-weight: 100 900; }
  :root { --red: #D92C1C; --ink: #07090c; --white: #f5f7fa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: var(--ink); overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); font-family: "Inter Tight", sans-serif; color: var(--white); }
  canvas { position: absolute; left: 0; top: 0; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #scrim { background: linear-gradient(180deg, rgba(7,9,12,.9) 0%, rgba(7,9,12,.45) 20%, rgba(7,9,12,0) 34%, rgba(7,9,12,0) 62%, rgba(7,9,12,.55) 74%, rgba(7,9,12,.92) 100%); }
  #vignette { background: radial-gradient(110% 80% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }

  #progress { position: absolute; top: 64px; left: 60px; right: 60px; display: flex; gap: 10px; }
  #progress div { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
  #progress i { display: block; height: 100%; width: 0; background: var(--white); }

  .title { position: absolute; left: 60px; right: 60px; top: 230px; display: none; }
  .line { overflow: hidden; padding-bottom: .06em; }
  .line > span { display: inline-block; font-weight: 900; font-size: 128px; line-height: .92; letter-spacing: -.045em; }
  .title.big .line > span { font-size: 168px; }
  .r { color: var(--red); }
  .hl { background: var(--red); color: var(--white); padding: 0 .12em; border-radius: .08em; }
  .stat .line > span { font-size: 260px; line-height: .88; letter-spacing: -.055em; }
  .stat .line > span small { font-size: 110px; letter-spacing: -.03em; margin-left: 14px; }
  .stat .line.lab > span { font-size: 60px; font-weight: 800; letter-spacing: -.01em; color: rgba(245,247,250,.8); line-height: 1.1; }

  #cards { position: absolute; left: 0; right: 0; top: 600px; height: 700px; }
  .pcard { position: absolute; left: 50%; top: 0; width: 470px; height: 620px; margin-left: -235px; border-radius: 36px; overflow: hidden; background: #111; box-shadow: 0 30px 80px rgba(0,0,0,.6); border: 2px solid rgba(255,255,255,.14); display: none; }
  .pcard img { width: 100%; height: 100%; object-fit: cover; }
  .pcard.wide { width: 860px; height: 400px; margin-left: -430px; top: 110px; }

  #caption { position: absolute; top: 1400px; left: 70px; right: 70px; text-align: center; font-weight: 800; font-size: 62px; line-height: 1.22; letter-spacing: -.015em; }
  #caption .w { display: inline-block; padding: 2px 10px; margin: 0 -6px; border-radius: 14px; text-shadow: 0 4px 24px rgba(0,0,0,.7); }
  #caption .w.on { background: var(--red); text-shadow: none; }

  #outro { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 60px; padding-bottom: 160px; }
  #logo { width: 420px; height: 420px; box-shadow: 0 40px 120px rgba(217,44,28,.4); }
  #logo img { width: 100%; height: 100%; display: block; }
  #cta { font-weight: 800; font-size: 48px; letter-spacing: -.01em; padding: 22px 44px; border-radius: 999px; background: var(--white); color: var(--ink); }
  #cta b { color: var(--red); }
  #flash { background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="pc" width="1080" height="1920"></canvas>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="scrim" class="layer"></div>
  <div id="vignette" class="layer"></div>
  <div id="progress"><div><i></i></div><div><i></i></div><div><i></i></div><div><i></i></div><div><i></i></div></div>
  <div id="titles"></div>
  <div id="cards">
    <div class="pcard"><img src="assets/car.jpg"></div>
    <div class="pcard"><img src="assets/backpack.jpg"></div>
    <div class="pcard"><img src="assets/bike.jpg"></div>
    <div class="pcard"><img src="assets/walk.jpg"></div>
    <div class="pcard wide"><img src="assets/island.jpg"></div>
  </div>
  <div id="caption"></div>
  <div id="outro"><div id="logo"><img src="assets/logo.jpg"></div><div id="cta"></div></div>
  <canvas id="grain" width="540" height="960" style="width:1080px;height:1920px;opacity:.06;mix-blend-mode:overlay"></canvas>
  <div id="flash" class="layer"></div>
</div>

<script src="assets/clouds.js"></script>
<script src="copy.js"></script>
<script src="engine.js"></script>
<script>
/* ---------- timeline: 128 BPM, 24 bars = 45 s (keep in sync with music.py) ---------- */
const DUR = 45, BAR = 1.875, CUTS = [0, 4 * BAR, 10 * BAR, 16 * BAR, 21 * BAR, DUR]; // 0 / 7.5 / 18.75 / 30 / 39.375 / 45
const LANG = new URLSearchParams(location.search).get("lang") || "it";
const TXT = window.COPY[LANG];
document.documentElement.lang = LANG;
$("cta").innerHTML = TXT.cta;

// one reading target at a time: no caption may overlap a title
window.overlaps = [];
for (const [a, b, s] of TXT.caps) for (const T of TXT.titles) if (a < T.b && T.a < b) window.overlaps.push(`${s} ⟷ ${T.lines || T.stat}`);

const fmtHTML = s => s.replace(/<r>/g, '<span class="r">').replace(/<\/r>/g, "</span>").replace(/<hl>/g, '<span class="hl">').replace(/<\/hl>/g, "</span>");
const titleEls = TXT.titles.map(T => {
  const el = document.createElement("div"); el.className = "title" + (T.big ? " big" : "") + (T.stat ? " stat" : "");
  const lines = T.stat ? [`${T.stat[0].replace("<", "&lt;")}<small>${T.stat[1]}</small>`, T.stat[2]] : T.lines.map(fmtHTML);
  el.innerHTML = lines.map((l, i) => `<div class="line${T.stat && i === 1 ? " lab" : ""}"><span>${l}</span></div>`).join("");
  $("titles").appendChild(el); return el;
});

/* ---------- cameras ---------- */
let TOWNC, HOSP, MAP;
const RAWT = [0.62, 0.76, 1.0];
function camTown(t) { const k = seg(t, 0, 7.8); return mkCam(lerp(-0.16, 0.14, inOut(k)), lerp(0.1, 0.02, k), lerp(1150, 860, outExpo(k * 0.8)), 0, 0, -60, 1000); }
function camHosp(t) { const k = seg(t, 29.8, DUR); return mkCam(lerp(0.14, -0.16, inOut(k)), 0.05, lerp(1040, 880, smooth(k)), 0, 0, -50, 900); }
function camMap(t) {
  const K = [[7.3, -0.35, 1.25, 1250, -40, 60], [11.2, -0.18, 1.1, 820, -60, 110], [14.2, 0.05, 0.98, 700, 40, -120], [18.75, 0.2, 1.15, 1000, 0, 0], [30, 0.4, 1.2, 1150, 20, 0]];
  let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
  const a = K[i], b = K[i + 1], k = inOut(seg(t, a[0], b[0]));
  return mkCam(lerp(a[1], b[1], k), lerp(a[2], b[2], k), lerp(a[3], b[3], k), lerp(a[4], b[4], k), 0, lerp(a[5], b[5], k), 1000);
}

/* ---------- map overlay: car route, blocked zone, islands, new coverage ---------- */
function ring(cam, cx, cz, rx, rz, n = 48) { fctx.beginPath(); for (let k = 0; k <= n; k++) { const an = k / n * 6.283, p = project(cam, cx + Math.cos(an) * rx, 1, cz + Math.sin(an) * rz); k ? fctx.lineTo(p[0], p[1]) : fctx.moveTo(p[0], p[1]); } }
function mapOverlay(t, cam, mA) {
  const pr = seg(t, 8.0, 11.0);
  const pts = ROUTE.map(([x, z]) => project(cam, x, 1, z));
  let L = 0; const segL = []; for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segL.push(l); L += l; }
  let rem = L * pr, head = pts[0];
  fctx.save(); fctx.globalAlpha = mA; fctx.lineCap = fctx.lineJoin = "round";
  fctx.shadowColor = "rgba(255,50,40,1)"; fctx.shadowBlur = 22; fctx.strokeStyle = "#ff3b2e"; fctx.lineWidth = 7;
  fctx.beginPath(); fctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && rem > 0; i++) { const f = Math.min(1, rem / segL[i - 1]); head = [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)]; fctx.lineTo(head[0], head[1]); rem -= segL[i - 1]; }
  if (pr > 0) fctx.stroke();
  fctx.shadowBlur = 0;
  if (pr > 0 && t < 18.75) {
    fctx.fillStyle = "#fff"; fctx.beginPath(); fctx.arc(head[0], head[1], 11, 0, 6.283); fctx.fill();
    fctx.strokeStyle = "#ff3b2e"; fctx.lineWidth = 5; fctx.beginPath(); fctx.arc(head[0], head[1], 20 + 6 * Math.sin(t * 12), 0, 6.283); fctx.stroke();
  }
  if (t > 11.0 && t < 18.75) {
    const k = outBack(seg(t, 11.0, 11.3)), e = pts[pts.length - 1], s = 24 * k;
    fctx.strokeStyle = "#fff"; fctx.lineWidth = 8; fctx.beginPath(); fctx.moveTo(e[0] - s, e[1] - s); fctx.lineTo(e[0] + s, e[1] + s); fctx.moveTo(e[0] + s, e[1] - s); fctx.lineTo(e[0] - s, e[1] + s); fctx.stroke();
  }
  fctx.setLineDash([14, 10]); fctx.lineDashOffset = -t * 40; fctx.strokeStyle = "#ff3b2e"; fctx.lineWidth = 4;
  const pz = seg(t, 11.2, 11.6) * (1 - seg(t, 18.4, 18.75));
  if (pz > 0) { fctx.globalAlpha = mA * pz; ring(cam, PED.x, PED.z, PED.rx, PED.rz); fctx.stroke(); }
  const ir = 1 - seg(t, 18.4, 18.75);
  ISL.forEach(([ix, iz, r], j) => {
    const q = seg(t, 12.4 + j * 0.25, 12.8 + j * 0.25); if (!q || !ir) return;
    fctx.globalAlpha = mA * ir * q; const rr = (r + 10) * (0.6 + 0.4 * outBack(q)); ring(cam, ix, iz, rr, rr, 40); fctx.stroke();
  });
  // solution: bike/walk through the old town, boat to the islands
  const cov = seg(t, 26.0, 29.2), covA = 1 - seg(t, 29.6, 30);
  if (cov > 0 && covA > 0) {
    fctx.setLineDash([10, 12]); fctx.lineDashOffset = -t * 60; fctx.globalAlpha = Math.min(1, mA * 1.8) * covA; fctx.strokeStyle = "#fff"; fctx.lineWidth = 5;
    const paths = [[ROUTE[ROUTE.length - 1], [PED.x - 20, PED.z - 40], [PED.x + 15, PED.z], [PED.x - 10, PED.z + 45]], [[inletX(120) - 30, 120], [inletX(20), 20], ...ISL.map(([x, z]) => [x, z])]];
    for (const path of paths) {
      const P2 = path.map(([x, z]) => project(cam, x, 1, z)), n = (P2.length - 1) * cov;
      fctx.beginPath(); fctx.moveTo(P2[0][0], P2[0][1]);
      for (let i = 1; i <= Math.ceil(n); i++) { const f = Math.min(1, n - (i - 1)); fctx.lineTo(lerp(P2[i - 1][0], P2[i][0], f), lerp(P2[i - 1][1], P2[i][1], f)); }
      fctx.stroke();
    }
  }
  fctx.restore();
}

/* ---------- text ---------- */
function titles(t) {
  TXT.titles.forEach((T, n) => {
    const el = titleEls[n], on = t > T.a - 0.01 && t < T.b + 0.01;
    el.style.display = on ? "block" : "none"; if (!on) return;
    el.querySelectorAll(".line > span").forEach((sp, i) => {
      const d = T.stagger ? T.stagger[i] || 0 : i * 0.25, k = outExpo(seg(t, T.a + d, T.a + d + 0.55)), q = inOut(seg(t, T.b - 0.35, T.b));
      sp.style.transform = `translateY(${(1 - k) * 110 - q * 110}%)`;
    });
  });
}
const capEl = $("caption"); let capIdx = -2;
function captions(t) {
  const idx = TXT.caps.findIndex(([a, b]) => t >= a && t < b);
  if (idx !== capIdx) { capIdx = idx; capEl.innerHTML = idx < 0 ? "" : TXT.caps[idx][2].split(" ").map(w => `<span class="w">${w}</span>`).join(" "); }
  if (idx < 0) return;
  const [a, b] = TXT.caps[idx], ws = capEl.querySelectorAll(".w"), n = ws.length, span = Math.min(b - a - 0.5, n * 0.26), step = span / n, out = seg(t, b - 0.18, b);
  ws.forEach((w, i) => {
    const ti = a + i * step, k = outBack(seg(t, ti, ti + 0.16));
    w.style.opacity = t >= ti ? 1 - out : 0;
    w.style.transform = `translateY(${(1 - k) * 26}px) scale(${0.82 + 0.18 * k})`;
    w.classList.toggle("on", t >= ti && t < ti + step && t < a + span + 0.25);
  });
}

const CARD_T = [22.5, 24.1, 26.0, 26.9, 27.8];
function cards(t) {
  const el = $("cards"), on = t > 22.4 && t < 30.05; el.style.display = on ? "block" : "none"; if (!on) return;
  const out = seg(t, 29.7, 30.05);
  el.querySelectorAll(".pcard").forEach((c, i) => {
    const t0 = CARD_T[i], k = outBack(seg(t, t0, t0 + 0.45));
    const push = CARD_T.filter(x => t >= x + 0.1 && x > t0).length, rot = [-4, 3, -2.5, 3.5, 0][i];
    const bx = [-150, 150, -150, 150, 0][i], by = [0, 20, 40, 60, 0][i];
    c.style.display = t >= t0 ? "block" : "none"; c.style.zIndex = i; c.style.opacity = 1 - out;
    c.style.transform = `translate(${bx * 0.55 + (1 - k) * bx * 1.2}px, ${by + (1 - k) * 900 - push * 26}px) rotate(${rot * (0.6 + 0.4 * k) + (1 - k) * rot * 3}deg) scale(${1 - push * 0.06})`;
    c.style.filter = `brightness(${1 - push * 0.22})`;
  });
}

function outro(t) {
  const T0 = CUTS[4], el = $("outro"), on = t >= T0; el.style.display = on ? "flex" : "none"; if (!on) return;
  const k = outBack(seg(t, T0 + 0.1, T0 + 0.7)), lg = $("logo"), r = 1 - outExpo(seg(t, T0 + 0.1, T0 + 0.6));
  lg.style.transform = `scale(${0.4 + 0.6 * k}) rotate(${(1 - k) * -8}deg)`; lg.style.opacity = seg(t, T0 + 0.1, T0 + 0.3);
  lg.style.clipPath = `inset(${r * 50}% 0 ${r * 50}% 0)`;
  const kc = outBack(seg(t, T0 + 1.2, T0 + 1.7)), cta = $("cta"); cta.style.opacity = seg(t, T0 + 1.2, T0 + 1.4); cta.style.transform = `scale(${0.7 + 0.3 * kc})`;
}

const grains = [0, 1, 2, 3].map(() => { const c = document.createElement("canvas"); c.width = 540; c.height = 960; const g = c.getContext("2d"), d = g.createImageData(540, 960); for (let i = 0; i < d.data.length; i += 4) { const v = R() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); return c; });
const gctx = $("grain").getContext("2d");

/* ---------- main ---------- */
function render(t) {
  let shake = 0; for (const c of CUTS.slice(1, 5)) if (t >= c) shake = Math.max(shake, Math.exp(-(t - c) * 9));
  acc.fill(0); fctx.clearRect(0, 0, W, Hh);

  // 1 · Maó old town (real point-cloud render) scanned in
  const tA = 1 - seg(t, 7.2, 7.8);
  if (tA > 0) {
    const s = lerp(-TOWNC.w / 2 - 20, TOWNC.w / 2 + 20, 1 - Math.pow(1 - seg(t, 0.1, 4.2), 1.5));
    splat(TOWNC, camTown(t), { alpha: 0.95 * tA, sweep: s, band: 14, size: 2 });
  }
  // 2–3 · harbour map
  const mA = seg(t, 7.3, 8.0) * (t < 18.75 ? 1 : lerp(1, 0.45, seg(t, 18.75, 19.4))) * (1 - seg(t, 29.6, 30.1));
  if (mA > 0) {
    const cam = camMap(t);
    const pedK = seg(t, 11.2, 11.7) * (1 - seg(t, 18.3, 18.75)), islK = seg(t, 12.4, 13.0) * (1 - seg(t, 18.3, 18.75)), pulse = 0.75 + 0.25 * Math.sin(t * 14);
    const hot = (k) => [lerp(0.6, 1.4 * pulse, k), lerp(0.7, 0.25, k), lerp(0.9, 0.2, k)];
    splat(MAP, cam, { alpha: mA * (t < 8.4 ? outExpo(seg(t, 7.3, 8.4)) : 1), size: 2, tint: (k) => (k === 2 && pedK > 0 ? hot(pedK) : k === 4 && islK > 0 ? hot(islK) : null) });
    mapOverlay(t, cam, mA);
  }
  // 4 · Isla del Rey hospital (real point-cloud render): scan, then intensity colour sweep
  const hA = seg(t, 29.9, 30.3) * (t < CUTS[4] ? 1 : lerp(1, 0.22, seg(t, CUTS[4], CUTS[4] + 1)));
  if (hA > 0) {
    const s = lerp(-HOSP.w / 2 - 20, HOSP.w / 2 + 20, 1 - Math.pow(1 - seg(t, 30.1, 32.8), 1.5));
    const m = lerp(-HOSP.w / 2 - 40, HOSP.w / 2 + 40, inOut(seg(t, 33.8, 36.6)));
    splat(HOSP, camHosp(t), { alpha: 0.95 * hA, sweep: s, band: 12, mixSweep: m, band2: t < 36.7 ? 10 : 0, size: 2 });
  }
  flush();
  const sh = shake * 10;
  pc.style.transform = fx.style.transform = `translate(${Math.sin(t * 77) * sh}px, ${Math.cos(t * 63) * sh}px)`;

  titles(t); captions(t); cards(t); outro(t);
  $("progress").style.opacity = 1 - seg(t, CUTS[4] - 0.2, CUTS[4] + 0.2);
  document.querySelectorAll("#progress i").forEach((el, i) => el.style.width = `${100 * seg(t, CUTS[i], CUTS[i + 1])}%`);
  $("scrim").style.background = t < CUTS[4] ? "" : `linear-gradient(180deg, rgba(7,9,12,.9) 0%, rgba(7,9,12,${lerp(.45, .8, seg(t, CUTS[4], CUTS[4] + 1))}) 30%, rgba(7,9,12,${lerp(0, .7, seg(t, CUTS[4], CUTS[4] + 1))}) 50%, rgba(7,9,12,.95) 100%)`;
  let fl = 0; for (const c of CUTS.slice(1, 5)) if (t >= c) fl = Math.max(fl, 0.35 * Math.exp(-(t - c) * 14));
  $("flash").style.opacity = fl;
  gctx.drawImage(grains[Math.floor(t * 30) % 4], 0, 0);
}
window.render = render;
window.DURATION = DUR;
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  TOWNC = await imageCloud(window.IMG_TOWN, 1.6, 320, RAWT);
  HOSP = await imageCloud(window.IMG_HOSPITAL, 1.45, 260, RAWT);
  MAP = mapCloud();
  render(0); return true;
})();
</script>
</body>
</html>
